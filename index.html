<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TapVia | Deneyiminiz Nasıldı?</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f5f6f7;

    color: #31475c;
}


/* ANA KART */

.review-card {

    width: 100%;
    max-width: 520px;

    padding: 55px 30px;

    text-align: center;

    background: #ffffff;

    border-radius: 28px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.08);
}


/* LOGO / ÜST YAZI */

.logo {

    margin-bottom: 18px;

    font-size: 14px;

    font-weight: 600;

    letter-spacing: 2px;

    color: #e6005c;

    text-transform: uppercase;
}


/* BAŞLIK */

h1 {

    margin: 0;

    font-size: 34px;

    line-height: 1.15;

    font-weight: 500;

    letter-spacing: -0.03em;
}


/* AÇIKLAMA */

.description {

    margin:
        18px
        auto
        0;

    max-width: 400px;

    font-size: 16px;

    line-height: 1.6;

    color: #6d7882;
}


/* YILDIZLAR */

.stars {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 4px;

    margin:
        38px
        0
        25px;
}


.star {

    width: 58px;

    height: 58px;

    padding: 0;

    border: none;

    background: transparent;

    font-size: 48px;

    line-height: 1;

    color: #d7d7d7;

    cursor: pointer;

    transition:
        transform .15s ease,
        color .15s ease;
}


.star:hover {

    color: #f5b800;

    transform:
        scale(1.15);
}


/* MESAJ */

.message {

    display: none;

    margin-top: 25px;

    padding: 22px;

    border-radius: 18px;

    background: #f7f7f7;

    font-size: 16px;

    line-height: 1.6;

    color: #4d5963;
}


/* SEÇİLEN YILDIZ */

.star.selected {

    color: #f5b800;

}


/* MOBİL */

@media(max-width: 500px) {

    .review-card {

        padding:
            45px
            20px;
    }


    h1 {

        font-size: 29px;
    }


    .star {

        width: 48px;

        height: 48px;

        font-size: 40px;
    }


    .stars {

        gap: 1px;
    }

}

</style>

</head>


<body>


<div class="review-card">


    <div class="logo">
        TapVia NFC
    </div>


    <h1>
        Deneyiminiz nasıldı?
    </h1>


    <p class="description">

        Deneyiminizi değerlendirmek için
        aşağıdaki yıldızlardan birini seçin.

    </p>


    <div class="stars">


        <button
            class="star"
            onclick="rate(1, this)"
            aria-label="1 yıldız"
        >
            ★
        </button>


        <button
            class="star"
            onclick="rate(2, this)"
            aria-label="2 yıldız"
        >
            ★
        </button>


        <button
            class="star"
            onclick="rate(3, this)"
            aria-label="3 yıldız"
        >
            ★
        </button>


        <button
            class="star"
            onclick="rate(4, this)"
            aria-label="4 yıldız"
        >
            ★
        </button>


        <button
            class="star"
            onclick="rate(5, this)"
            aria-label="5 yıldız"
        >
            ★
        </button>


    </div>


    <div
        id="message"
        class="message"
    ></div>


</div>


<script>


function rate(star, element) {


    /*
    ==========================================
    SEÇİLEN YILDIZLARI BOYA
    ==========================================
    */

    const stars =
        document.querySelectorAll(".star");


    stars.forEach(function(item, index) {

        if(index < star) {

            item.classList.add("selected");

        } else {

            item.classList.remove("selected");

        }

    });


    /*
    ==========================================
    1 - 3 YILDIZ
    SAYFADA KAL
    ==========================================
    */

    if(star <= 3) {


        const message =
            document.getElementById("message");


        message.style.display =
            "block";


        message.innerHTML =

            "<strong>Görüşünüz bizim için önemli.</strong>" +

            "<br><br>" +

            "Deneyiminizi daha iyi hale getirebilmemiz " +
            "için görüşünüzü bizimle paylaşabilirsiniz.";


    }


    /*
    ==========================================
    4 - 5 YILDIZ
    LİNKE GİT
    ==========================================
    */

    else {


        /*
        TEST LİNKİ

        Daha sonra buraya istediğin
        bağlantıyı yazabilirsin.
        */


        window.location.href =
            "https://www.google.com";


    }

}


</script>


</body>

</html>
