<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TapVia - Değerlendirme</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    font-family: Arial, Helvetica, sans-serif;

    background: #f5f6f7;

    color: #31475c;
}

.review-card {
    width: 100%;
    max-width: 520px;

    padding: 55px 30px;

    text-align: center;

    background: white;

    border-radius: 28px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.08);
}

.logo {
    margin-bottom: 18px;

    font-size: 14px;

    font-weight: 600;

    letter-spacing: 2px;

    color: #e6005c;

    text-transform: uppercase;
}

h1 {
    margin: 0;

    font-size: 34px;

    line-height: 1.15;

    font-weight: 500;
}

.description {
    margin: 18px auto 0;

    max-width: 400px;

    font-size: 16px;

    line-height: 1.6;

    color: #6d7882;
}

.stars {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 4px;

    margin: 38px 0 25px;
}

.star {
    width: 58px;
    height: 58px;

    padding: 0;

    border: none;

    background: transparent;

    font-size: 48px;

    line-height: 1;

    color: #d7d7d7;

    cursor: pointer;

    transition:
        transform .15s ease,
        color .15s ease;
}

.star:hover {
    color: #f5b800;

    transform: scale(1.15);
}

.star.selected {
    color: #f5b800;
}

.message {
    display: none;

    margin-top: 25px;

    padding: 22px;

    border-radius: 18px;

    background: #f7f7f7;

    font-size: 16px;

    line-height: 1.6;

    color: #4d5963;
}

@media(max-width:500px) {

    .review-card {
        padding: 45px 20px;
    }

    h1 {
        font-size: 29px;
    }

    .star {
        width: 48px;
        height: 48px;

        font-size: 40px;
    }

    .stars {
        gap: 1px;
    }

}

</style>
</head>


<body>


<div class="review-card">

    <div class="logo">
        TapVia NFC
    </div>

    <h1>
        Deneyiminiz nasıldı?
    </h1>

    <p class="description">
        Deneyiminizi değerlendirmek için
        aşağıdaki yıldızlardan birini seçin.
    </p>


    <div class="stars">

        <button
            class="star"
            onclick="rate(1)"
            aria-label="1 yıldız">
            ★
        </button>

        <button
            class="star"
            onclick="rate(2)"
            aria-label="2 yıldız">
            ★
        </button>

        <button
            class="star"
            onclick="rate(3)"
            aria-label="3 yıldız">
            ★
        </button>

        <button
            class="star"
            onclick="rate(4)"
            aria-label="4 yıldız">
            ★
        </button>

        <button
            class="star"
            onclick="rate(5)"
            aria-label="5 yıldız">
            ★
        </button>

    </div>


    <div
        id="message"
        class="message">
    </div>

</div>


<script>

function rate(star) {

    /* Yıldızları doldur */

    const stars =
        document.querySelectorAll(".star");

    stars.forEach(function(item, index) {

        if (index < star) {

            item.classList.add("selected");

        } else {

            item.classList.remove("selected");

        }

    });


    /* =====================================
       1 - 3 YILDIZ
       SAYFADA KAL
       ===================================== */

    if (star <= 3) {

        const message =
            document.getElementById("message");

        message.style.display = "block";

        message.innerHTML =
            "<strong>Görüşünüz bizim için önemli.</strong>" +
            "<br><br>" +
            "Deneyiminizi bizimle paylaşabilirsiniz.";

    }


    /* =====================================
       4 - 5 YILDIZ
       VERDİĞİN GOOGLE LİNKİNE GİT
       ===================================== */

    else {

        window.location.href =
        "https://www.google.com/search?hl=tr-TR&gl=tr&q=Y%C4%B1ld%C4%B1z+Beyi+Aspava+Kebap,+Ya%C5%9Famkent,+3158.+Cd.+4/A,+06810+Yenimahalle/Ankara&ludocid=3944299170066724487&lsig=AB86z5WiHQQ-P5U0hwGY420h27oo#lrd=0x14d33ec9aa27dff3:0x36bcf73287b1f687,3";

    }

}

</script>


</body>
</html>
